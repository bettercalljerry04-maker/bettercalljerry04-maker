<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">Jerry_codemen — Embodied AI and Robotics</title>
  <desc id="description">A dark blue robotics workbench with a mint green articulated arm, a dotted motion path, and the name Jerry_codemen.</desc>
  <defs>
